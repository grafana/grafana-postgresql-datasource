services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: grafana
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  fixture-loader:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./tests/e2e/fixtures:/fixtures:ro
    entrypoint:
      - bash
      - -c
      - "set -e; PGPASSWORD=grafana psql postgresql://grafana@postgres/testdb -f /fixtures/schema.sql"
    restart: no

  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    configs:
      # Run the externalized plugin in place of the core PostgreSQL plugin.
      # Without as_external=true, DuplicatePluginIDValidation (pkg/services/pluginsintegration/pipeline/steps.go)
      # drops the external plugin because the core one is already registered under
      # id=grafana-postgresql-datasource, so CI would silently test core instead.
      - source: grafana_custom_ini
        target: /etc/grafana/grafana.ini
    depends_on:
      fixture-loader:
        condition: service_completed_successfully
    environment:
      # Grafana 13 enabled splashScreen by default; it renders as an overlay that
      # blocks all Playwright interactions. Suppress it unconditionally.
      GF_FEATURE_TOGGLES_splashScreen: "false"
      # Provisioning env vars — override at runtime for Cloud E2E (DS_INSTANCE_* from Vault).
      DS_INSTANCE_HOST: postgres
      DS_INSTANCE_PORT: "5432"
      DS_INSTANCE_USERNAME: grafana
      DS_INSTANCE_DATABASE: testdb
      DS_INSTANCE_PASSWORD: grafana

configs:
  grafana_custom_ini:
    content: |
      [plugin.grafana-postgresql-datasource]
      as_external = true
