apiVersion: 1

datasources:
  - name: postgresql
    type: grafana-postgresql-datasource
    uid: postgresql-e2e
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    url: "${DS_INSTANCE_HOST}:${DS_INSTANCE_PORT}"
    user: "${DS_INSTANCE_USERNAME}"
    jsonData:
      database: "${DS_INSTANCE_DATABASE}"
      sslmode: disable
      postgresVersion: 1500
    secureJsonData:
      password: "${DS_INSTANCE_PASSWORD}"
