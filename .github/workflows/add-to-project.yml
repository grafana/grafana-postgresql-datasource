name: Add issues & PRs to Grafana Data Source Plugins Squad project
on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened

jobs:
  add-to-project:
    # Fork PRs get a read-only GITHUB_TOKEN and cannot be granted `id-token: write`,
    # so minting the GitHub App token via OIDC always fails. Skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    uses: grafana/data-sources-ci-workflows/.github/workflows/reusable-add-to-project.yml@main # zizmor: ignore[unpinned-uses]
